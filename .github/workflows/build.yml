name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # No `latest`. Whatever consumes this image should pin a tag and treat
          # a moving one as a defect -- a tag deployment that silently changes
          # wallet code under a running programme is not a rollout, it is an
          # incident.
          #
          # `flavor: latest=false` is what actually enforces that. Leaving it
          # out does not: metadata-action defaults to latest=auto and adds the
          # tag itself on any semver push, so this comment described an
          # intention the configuration did not implement -- and v0.0.1 shipped
          # a `latest` because of it.
          flavor: |
            latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
