apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wildtag
  labels: { app: wildtag }
spec:
  serviceName: wildtag
  # One replica, and a StatefulSet rather than a Deployment.
  #
  # A Deployment's RollingUpdate runs the new pod alongside the old by design.
  # Two instances sharing one wallet would both build transactions against the
  # same UTXOs, and the loser of each race is a crabber standing in a marsh
  # being told their reward failed. OrderedReady stops the old pod first.
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: wildtag }
  template:
    metadata:
      labels: { app: wildtag }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # This is what makes the PVC writable by the image's UID. Without it
        # /data is writable-but-empty, which is the quiet catastrophe: the
        # program mints a brand-new keys.json, comes up healthy as a completely
        # different wallet with a different deposit address, and reports a
        # balance of zero that is technically correct.
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }

      containers:
        - name: wildtag
          # Pinned by digest or immutable tag in the GitOps repository. A
          # moving tag under a running money-handling program is an incident,
          # not a rollout.
          image: ghcr.io/dymurray/dnr-tags:REPLACE_ME
          args: ["serve"]

          envFrom:
            - configMapRef: { name: wildtag }
            - secretRef: { name: wildtag }

          ports:
            - name: http
              containerPort: 8120

          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            # No CPU limit: throttling mid-broadcast shows up as a stalled
            # redemption rather than an error, and a stalled redemption holds a
            # tag out of service. Memory is capped because a leak should
            # restart the pod rather than the node.
            limits: { memory: "1Gi" }

          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20

          # /readyz reports the wallet balance. It deliberately does NOT fail on
          # an empty wallet: a program that has run out of money can still serve
          # the public dashboard, still show a crabber their crab's history, and
          # still take a report. Only arming new tags is blocked, and pulling
          # the pod out of service would hide that rather than fix it.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10

      # The shutdown path drains in-flight redemptions. A SIGKILL landing
      # between SignAction and the database write leaves a broadcast
      # transaction the application does not know about -- recoverable by the
      # audit, but only after somebody notices.
      terminationGracePeriodSeconds: 60

      volumes:
        - name: tmp
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
